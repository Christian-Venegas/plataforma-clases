# ============================================================
#  CONFIGURACIÓN DEL BACKEND — Plataforma de Cursos
#  Archivo: src/main/resources/application.yml
# ============================================================

spring:
  application:
    name: plataforma

  # ===== CONEXIÓN A POSTGRESQL =====
  datasource:
    url: jdbc:postgresql://localhost:5432/plataforma_cursos
    username: postgres          # usa variable de entorno o 'postgres' por defecto
    password: 12345678     # cámbialo por tu contraseña real de Postgres
    driver-class-name: org.postgresql.Driver

  # ===== JPA / HIBERNATE =====
  jpa:
    hibernate:
      ddl-auto: validate                   # 'validate' = NO toca tus tablas, solo verifica. Flyway manda.
    show-sql: true                         # muestra el SQL en consola (útil para aprender/depurar)
    properties:
      hibernate:
        format_sql: true                   # formatea el SQL para leerlo mejor
        #dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false                    # buena práctica: evita fugas de conexión

  # ===== FLYWAY (versiona tu base de datos) =====
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration      # aquí irán tus scripts SQL

# ===== PUERTO DEL SERVIDOR =====
server:
  port: 8080                               # tu API estará en http://localhost:8080

# ===== SECRETOS DE LA APP (JWT) =====
app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-por-una-larga-y-secreta-de-minimo-32-caracteres}
    expiration-ms: 86400000                # 1 día (en milisegundos)
    refresh-expiration-ms: 604800000       # 7 días para el refresh token

# ===== LOGS (para ver qué pasa) =====
logging:
  level:
    org.springframework.security: INFO
    com.academy.plataforma: DEBUG          # tu paquete: verás tus propios logs en detalle